                  </div>
                </div>
              `).join('')}
            </div>

            <div class="p-3.5 rounded-xl bg-terracotta-50 border border-terracotta-200 text-center">
              <p class="text-xs sm:text-sm font-bold text-terracotta-800">${data.data.insight}</p>
              <p class="text-[11px] text-warm-600 mt-0.5">全課 50 頁展示完畢 ｜ 祝各位同學直播順利開出紅盤！</p>
            </div>
          </div>
        `;
      }

      wrapper.innerHTML = contentHtml;
      lucide.createIcons();
    }

    // 翻頁控制
    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        renderSlide(currentSlide);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function goToSlide(index) {
      currentSlide = index;
      renderSlide(currentSlide);
      toggleDrawer(false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 鍵盤導航
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "Space") {
        e.preventDefault();
        nextSlide();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === "f") {
        e.preventDefault();
        toggleFullScreen();
      } else if (e.key.toLowerCase() === "m") {
        e.preventDefault();
        toggleDrawer();
      } else if (e.key === "Escape") {
        toggleDrawer(false);
      }
    });

    // 真正全螢幕控制 (含各瀏覽器前綴與狀態切換)
    function toggleFullScreen() {
      const doc = document.documentElement;
      const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
      const icon = document.getElementById("fullscreen-icon");
      const text = document.getElementById("fullscreen-text");

      if (!isFull) {
        if (doc.requestFullscreen) {
          doc.requestFullscreen().catch(() => {});
        } else if (doc.webkitRequestFullscreen) {
          doc.webkitRequestFullscreen();
        } else if (doc.mozRequestFullScreen) {
          doc.mozRequestFullScreen();
        } else if (doc.msRequestFullscreen) {
          doc.msRequestFullscreen();
        }
        if (text) text.innerText = "退出全螢幕";
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.mozCancelFullScreen) {
          document.mozCancelFullScreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
        if (text) text.innerText = "全螢幕";
      }
    }

    // 監聽全螢幕狀態更新文字與圖標
    document.addEventListener("fullscreenchange", () => {
      const isFull = !!document.fullscreenElement;
      const text = document.getElementById("fullscreen-text");
      if (text) text.innerText = isFull ? "退出全螢幕" : "全螢幕";
    });

    // 手機觸控左右滑動 (Touch Swipe for Mobile)
    let touchStartX = 0;
    let touchStartY = 0;
    document.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      // 橫向滑動距離大於 50px 且橫向滑動幅度大於垂直滾動幅度
      if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX < 0) {
          nextSlide(); // 向左滑 ➔ 下一頁
        } else {
          prevSlide(); // 向右滑 ➔ 上一頁
        }
      }
    }, { passive: true });

    // 抽屜目錄開關
    function toggleDrawer(forceState) {
      const drawer = document.getElementById("overview-drawer");
      const backdrop = document.getElementById("drawer-backdrop");
      const isOpen = !drawer.classList.contains("translate-x-full");
      const shouldOpen = (forceState !== undefined) ? forceState : !isOpen;

      if (shouldOpen) {
        drawer.classList.remove("translate-x-full");
        backdrop.classList.remove("hidden");
      } else {
        drawer.classList.add("translate-x-full");
        backdrop.classList.add("hidden");
      }
    }

    // 初始化抽屜清單
    function buildDrawerList() {
      const listContainer = document.getElementById("drawer-list");
      listContainer.innerHTML = slidesData.map((s, idx) => `
        <div onclick="goToSlide(${idx})" class="p-2.5 rounded-xl bg-white border border-warm-200 hover:border-terracotta-500 hover:shadow-sm cursor-pointer transition flex items-center justify-between group">
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="w-6 h-6 rounded-md bg-warm-100 text-warm-700 font-mono text-xs font-bold flex items-center justify-center group-hover:bg-terracotta-500 group-hover:text-white transition flex-shrink-0">
              ${String(idx + 1).padStart(2, '0')}
            </span>
            <div class="min-w-0">
              <div class="text-xs font-bold text-warm-900 group-hover:text-terracotta-600 transition truncate">${s.title}</div>
              <div class="text-[10px] text-warm-500 truncate">${s.module}</div>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-warm-400 group-hover:text-terracotta-500 transition flex-shrink-0"></i>
        </div>
      `).join('');
    }

    // 啟動
    window.addEventListener("DOMContentLoaded", () => {
      buildDrawerList();
      renderSlide(currentSlide);
    });
  </script>
</body>
</html>
