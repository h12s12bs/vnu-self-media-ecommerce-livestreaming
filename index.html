            <!-- Profile Info Grid -->

                <div class="warm-card p-5 flex flex-col justify-between hover:shadow-md transition">

      // 2. 四大支柱 / 核心圖卡 (Four Pillars)
      else if (data.type === "four_pillars") {
        contentHtml = `
          <div class="h-full flex flex-col justify-between p-2 md:p-6 animate-fade-in">

            <div class="mb-4">
              <div class="flex items-center gap-2 mb-1.5">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1 items-stretch">

                const colorMap = {
                  terracotta: 'border-terracotta-500 text-terracotta-600 bg-terracotta-50',
                  sage: 'border-sage-500 text-sage-600 bg-sage-50',

              <!-- 左邊：傳統 / 劣勢 -->
              <div class="p-6 rounded-2xl bg-white border border-warm-300 flex flex-col justify-between shadow-sm">

                  <div class="flex items-center justify-between mb-4 pb-3 border-b border-warm-200">

                  </div>
                  <div class="space-y-3">
                    ${data.data.leftPoints.map(pt => `
                      <div class="flex items-start gap-2.5 text-xs md:text-sm text-warm-700">
                        <i data-lucide="x" class="w-4 h-4 text-stone-400 mt-0.5 flex-shrink-0"></i>

                      </div>
                    `).join('')}
                  </div>
                </div>
                <div class="mt-4 pt-3 border-t border-warm-200 text-xs font-semibold text-stone-500 text-center">
                  傳統模式 · 邊際效益遞減
                </div>
              </div>

              <!-- 右邊：Agentic / 優勢 -->
              <div class="p-6 rounded-2xl bg-white border-2 border-terracotta-500/80 flex flex-col justify-between shadow-md relative overflow-hidden">
                <div class="absolute top-0 right-0 w-24 h-24 bg-terracotta-50 rounded-bl-full -z-0"></div>
                <div class="relative z-10">
                  <div class="flex items-center justify-between mb-4 pb-3 border-b border-terracotta-100">
                    <h3 class="text-lg font-bold text-terracotta-600 flex items-center gap-2">
                      <i data-lucide="zap" class="w-5 h-5 text-terracotta-500"></i> ${data.data.rightTitle}
                    </h3>
                    <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-terracotta-100 text-terracotta-700">${data.data.rightBadge}</span>
                  </div>
                  <div class="space-y-3">
                    ${data.data.rightPoints.map(pt => `
                      <div class="flex items-start gap-2.5 text-xs md:text-sm text-warm-900 font-medium">

            <!-- 底部 Takeaway -->

          </div>
        `;
      }
      // 4. 水平步驟與管線 (Stepper)
      else if (data.type === "stepper") {
        contentHtml = `
          <div class="h-full flex flex-col justify-between p-2 md:p-6 animate-fade-in">
            <!-- Header -->
            <div class="mb-4">
              <div class="flex items-center gap-2 mb-1.5">
                <span class="warm-badge bg-sage-100 text-sage-700 border border-sage-200">

                </span>

              <p class="text-sm md:text-base font-semibold text-warm-600">${data.subtitle}</p>

            <!-- 水平或垂直 Stepper 卡片 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 flex-1 items-stretch">
              ${data.data.steps.map((st, i) => `
                <div class="warm-card p-6 flex flex-col justify-between relative overflow-hidden group hover:border-terracotta-400 transition">
                  <div>
                    <div class="flex items-center justify-between mb-4">
                      <span class="w-8 h-8 rounded-full bg-warm-100 border border-warm-300 text-warm-800 font-bold text-xs flex items-center justify-center">
                        0${i+1}
                      </span>
                      <span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-terracotta-50 text-terracotta-700 border border-terracotta-200">
                        ${st.tag}
                      </span>
                    </div>
                    <div class="text-xs font-bold text-warm-500 uppercase tracking-wider mb-1">${st.phase}</div>
                    <h3 class="text-base font-bold text-warm-900 mb-2.5">${st.title}</h3>
                    <p class="text-xs md:text-sm text-warm-700 leading-relaxed">${st.desc}</p>
                  </div>
                  <div class="mt-4 pt-3 border-t border-warm-100 flex items-center justify-between text-xs text-warm-500">
                    <span>階段交付物</span>
                    <i data-lucide="arrow-right" class="w-4 h-4 text-warm-400 group-hover:text-terracotta-500 transition"></i>
                  </div>
                </div>
              `).join('')}
            </div>

            <!-- 底部 Takeaway -->
            <div class="mt-4 p-3.5 rounded-xl bg-warm-200/60 border border-warm-300 flex items-center gap-2.5 text-xs md:text-sm font-semibold text-warm-800">
              <i data-lucide="lightbulb" class="w-4 h-4 text-terracotta-500 flex-shrink-0"></i>
              <span>${data.data.insight}</span>
            </div>
          </div>
        `;
      }
      // 5. 視覺矩陣 (Visual Matrix / 3-4 Grid)
      else if (data.type === "visual_matrix") {
        contentHtml = `
          <div class="h-full flex flex-col justify-between p-2 md:p-6 animate-fade-in">
            <!-- Header -->
            <div class="mb-4">
              <div class="flex items-center gap-2 mb-1.5">
                <span class="warm-badge bg-warm-200 text-warm-800 border border-warm-300">
                  ${data.badge}
                </span>
                <span class="text-xs font-semibold text-warm-600">${data.module}</span>
              </div>
              <h2 class="text-2xl md:text-3xl font-black text-warm-900 tracking-tight">${data.title}</h2>
              <p class="text-sm md:text-base font-semibold text-warm-600">${data.subtitle}</p>
            </div>

            <!-- 卡片網格 (自適應 3 或 4 欄) -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-${data.data.cards.length === 3 ? '3' : '2'} gap-4 flex-1 items-stretch">
              ${data.data.cards.map((c, i) => `
                <div class="warm-card p-5 flex flex-col justify-between hover:shadow-md transition">
                  <div>
                    <div class="w-10 h-10 rounded-xl bg-warm-100 text-terracotta-600 border border-warm-200 flex items-center justify-center font-bold mb-3">
                      <i data-lucide="${c.icon || 'box'}" class="w-5 h-5"></i>
                    </div>
                    <h3 class="text-base font-bold text-warm-900 mb-2">${c.title || c.name}</h3>
                    <p class="text-xs md:text-sm text-warm-700 leading-relaxed">${c.desc}</p>
                  </div>
                  <div class="mt-4 pt-2 border-t border-warm-100 flex items-center gap-1.5 text-[11px] font-bold text-warm-500">
                    <span class="w-1.5 h-1.5 rounded-full bg-terracotta-500"></span> 關鍵賦能
                  </div>
                </div>
              `).join('')}
            </div>

            <!-- 底部 Takeaway -->
            <div class="mt-4 p-3.5 rounded-xl bg-warm-200/60 border border-warm-300 flex items-center gap-2.5 text-xs md:text-sm font-semibold text-warm-800">
              <i data-lucide="lightbulb" class="w-4 h-4 text-terracotta-500 flex-shrink-0"></i>
              <span>${data.data.insight}</span>
            </div>
          </div>
        `;
      }
      // 6. 流程圖 (Flow Chart / 6 步驟)
      else if (data.type === "flow_chart") {
        contentHtml = `
          <div class="h-full flex flex-col justify-between p-2 md:p-6 animate-fade-in">
            <!-- Header -->
            <div class="mb-3">
              <div class="flex items-center gap-2 mb-1.5">
                <span class="warm-badge bg-sage-100 text-sage-700 border border-sage-200">
                  ${data.badge}
                </span>
                <span class="text-xs font-semibold text-warm-600">${data.module}</span>
              </div>
              <h2 class="text-2xl md:text-3xl font-black text-warm-900 tracking-tight">${data.title}</h2>
              <p class="text-sm md:text-base font-semibold text-warm-600">${data.subtitle}</p>
            </div>

            <!-- 6-step 流程圖示 -->
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 flex-1 items-stretch py-2">
              ${data.data.flow.map((f, idx) => `
                <div class="warm-card p-4 flex flex-col justify-between relative group hover:border-terracotta-500 transition text-center">
                  <div>
                    <div class="w-8 h-8 mx-auto rounded-full bg-terracotta-100 text-terracotta-700 font-bold text-xs flex items-center justify-center mb-3 border border-terracotta-200">
                      ${f.step}
                    </div>
                    <h3 class="text-sm font-bold text-warm-900 mb-1.5">${f.name}</h3>
                    <p class="text-[11px] text-warm-600 leading-snug">${f.desc}</p>
                  </div>
                  <div class="text-[10px] text-warm-400 font-mono mt-3">STAGE ${f.step}</div>
                </div>
              `).join('')}
            </div>

            <!-- 底部 Takeaway -->
            <div class="mt-3 p-3.5 rounded-xl bg-warm-200/60 border border-warm-300 flex items-center gap-2.5 text-xs md:text-sm font-semibold text-warm-800">
              <i data-lucide="lightbulb" class="w-4 h-4 text-terracotta-500 flex-shrink-0"></i>
              <span>${data.data.insight}</span>
            </div>
          </div>

      }
      // 7. 結論 / 行動綱領 (Conclusion)
      else if (data.type === "conclusion") {
        contentHtml = `
          <div class="h-full flex flex-col justify-between p-4 md:p-8 animate-fade-in">
            <div class="mb-4">
              <span class="warm-badge bg-terracotta-500 text-white font-bold mb-2">
                ${data.badge}
              </span>
              <h2 class="text-3xl md:text-4xl font-black text-warm-900 tracking-tight mt-1">${data.title}</h2>
              <p class="text-base font-semibold text-terracotta-600">${data.subtitle}</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-5 flex-1 items-stretch">
              ${data.data.actions.map(act => `
                <div class="warm-card p-6 flex flex-col justify-between border-t-4 border-terracotta-500">
                  <div>
                    <span class="text-xs font-bold text-terracotta-600 uppercase tracking-widest">${act.step}</span>
                    <h3 class="text-lg font-bold text-warm-900 mt-2 mb-3">${act.title}</h3>
                    <p class="text-xs md:text-sm text-warm-700 leading-relaxed">${act.desc}</p>
                  </div>
                  <div class="pt-4 border-t border-warm-100 flex items-center gap-2 text-xs font-bold text-sage-600">
                    <i data-lucide="check-circle" class="w-4 h-4"></i> 落地執行目標
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="mt-6 p-4 rounded-xl bg-terracotta-50 border border-terracotta-200 text-center">
              <p class="text-sm md:text-base font-bold text-terracotta-800">${data.data.insight}</p>
              <p class="text-xs text-warm-600 mt-1">簡報展示完畢 · 按鍵盤方向鍵可隨時複習前面 49 頁</p>
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="slide active w-full h-[640px] md:h-[680px] bg-warm-50 rounded-2xl border border-warm-200 shadow-xl overflow-hidden flex flex-col">
          ${contentHtml}
        </div>
      `;

      // 重新啟用 Lucide 圖標
      lucide.createIcons();
    }

    // 翻頁控制
    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function goToSlide(index) {
      currentSlide = index;
      renderSlide(currentSlide);
      toggleDrawer(false);
    }

    // 鍵盤導航
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "Space") {
        e.preventDefault();
        nextSlide();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === "f") {
        e.preventDefault();
        toggleFullScreen();
      } else if (e.key.toLowerCase() === "m") {
        e.preventDefault();
        toggleDrawer();
      } else if (e.key === "Escape") {
        toggleDrawer(false);
      }
    });

    // 全螢幕切換
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // 抽屜目錄開關
    function toggleDrawer(forceState) {
      const drawer = document.getElementById("overview-drawer");
      const backdrop = document.getElementById("drawer-backdrop");
      const isOpen = !drawer.classList.contains("translate-x-full");
      const shouldOpen = (forceState !== undefined) ? forceState : !isOpen;

      if (shouldOpen) {
        drawer.classList.remove("translate-x-full");
        backdrop.classList.remove("hidden");
      } else {
        drawer.classList.add("translate-x-full");
        backdrop.classList.add("hidden");
      }
    }

    // 初始化抽屜目錄
    function buildDrawerList() {
      const listContainer = document.getElementById("drawer-list");
      listContainer.innerHTML = slidesData.map((s, idx) => `
        <div onclick="goToSlide(${idx})" class="p-3 rounded-xl bg-white border border-warm-200 hover:border-terracotta-500 hover:shadow-sm cursor-pointer transition flex items-center justify-between group">
          <div class="flex items-center gap-3">
            <span class="w-7 h-7 rounded-lg bg-warm-100 text-warm-700 font-mono text-xs font-bold flex items-center justify-center group-hover:bg-terracotta-500 group-hover:text-white transition">
              ${String(idx + 1).padStart(2, '0')}
            </span>
            <div>
              <div class="text-xs font-bold text-warm-900 group-hover:text-terracotta-600 transition line-clamp-1">${s.title}</div>
              <div class="text-[11px] text-warm-500 line-clamp-1">${s.module}</div>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-warm-400 group-hover:text-terracotta-500 transition"></i>
        </div>
      `).join('');
    }

    // 啟動加載
    window.addEventListener("DOMContentLoaded", () => {
      buildDrawerList();
      renderSlide(currentSlide);
    });
  </script>
</body>
</html>
