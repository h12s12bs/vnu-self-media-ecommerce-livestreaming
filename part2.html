              <div class="flex items-center gap-3 mb-2">
                <span class="warm-badge bg-terracotta-100 text-terracotta-700 border border-terracotta-300 slide-text-badge px-4 py-1.5">
                  ${data.badge}
                </span>
                <span class="slide-text-meta font-bold text-warm-600">${data.module}</span>
              </div>
              <h2 class="slide-text-title font-black text-warm-900 tracking-tight">${data.title}</h2>
              <p class="slide-text-subhead font-bold text-warm-600 mt-1">${data.subtitle}</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1 items-stretch">
              <div class="p-6 rounded-2xl bg-warm-50 border-2 border-warm-200 flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-4 pb-3 border-b-2 border-warm-200">
                    <h3 class="slide-text-subhead font-bold text-warm-900">${data.data.leftTitle}</h3>
                    <span class="px-3.5 py-1 rounded-full slide-text-meta font-bold bg-stone-200 text-stone-700">${data.data.leftBadge}</span>
                  </div>
                  <div class="space-y-3.5">
                    ${data.data.leftPoints.map(pt => `
                      <div class="flex items-start gap-3 slide-text-body text-warm-700 font-semibold">
                        <i data-lucide="x" class="w-6 h-6 text-stone-400 mt-1.5 flex-shrink-0"></i>
                        <span>${pt}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>

              <div class="p-6 rounded-2xl bg-white border-4 border-terracotta-500 flex flex-col justify-between shadow-lg">
                <div>
                  <div class="flex items-center justify-between mb-4 pb-3 border-b-2 border-terracotta-100">
                    <h3 class="slide-text-subhead font-bold text-terracotta-600 flex items-center gap-2">
                      <i data-lucide="zap" class="w-7 h-7 text-terracotta-500"></i> ${data.data.rightTitle}
                    </h3>
                    <span class="px-3.5 py-1 rounded-full slide-text-meta font-bold bg-terracotta-100 text-terracotta-700">${data.data.rightBadge}</span>
                  </div>
                  <div class="space-y-3.5">
                    ${data.data.rightPoints.map(pt => `
                      <div class="flex items-start gap-3 slide-text-body text-warm-900 font-bold">
                        <i data-lucide="check" class="w-6 h-6 text-sage-600 mt-1.5 flex-shrink-0 font-bold"></i>
                        <span>${pt}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>
            </div>

            <div class="p-5 rounded-2xl bg-warm-100 border-2 border-warm-200 flex items-center gap-3 slide-text-body font-bold text-warm-900 shadow-sm">
              <i data-lucide="lightbulb" class="w-8 h-8 text-terracotta-500 flex-shrink-0"></i>
              <span>${data.data.insight}</span>
            </div>
          </div>
        `;
      }
      // 5. 流程步驟 (Stepper)
      else if (data.type === "stepper") {
        contentHtml = `
          <div class="flex-1 flex flex-col justify-between space-y-6">
            <div>
              <div class="flex items-center gap-3 mb-2">
                <span class="warm-badge bg-sage-100 text-sage-700 border border-sage-300 slide-text-badge px-4 py-1.5">
                  ${data.badge}
                </span>
                <span class="slide-text-meta font-bold text-warm-600">${data.module}</span>
              </div>
              <h2 class="slide-text-title font-black text-warm-900 tracking-tight">${data.title}</h2>
              <p class="slide-text-subhead font-bold text-warm-600 mt-1">${data.subtitle}</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-1 items-stretch">
              ${data.data.steps.map((st, i) => `
                <div class="warm-card p-6 flex flex-col justify-between hover:border-terracotta-400 transition">
                  <div>
                    <div class="flex items-center justify-between mb-3.5">
                      <span class="w-12 h-12 rounded-full bg-warm-100 border-2 border-warm-300 text-warm-900 font-black slide-text-subhead flex items-center justify-center">
                        ${i+1}
                      </span>
                      <span class="px-3 py-1 rounded-lg slide-text-meta font-bold bg-terracotta-50 text-terracotta-700 border border-terracotta-200">
                        ${st.tag}
                      </span>
                    </div>
                    <div class="slide-text-meta font-bold text-warm-500 mb-1">${st.phase}</div>
                    <h3 class="slide-text-subhead font-bold text-warm-900 mb-3">${st.title}</h3>
                    <p class="slide-text-body text-warm-800 font-semibold leading-relaxed">${st.desc}</p>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="p-5 rounded-2xl bg-warm-100 border-2 border-warm-200 flex items-center gap-3 slide-text-body font-bold text-warm-900 shadow-sm">
              <i data-lucide="lightbulb" class="w-8 h-8 text-terracotta-500 flex-shrink-0"></i>
              <span>${data.data.insight}</span>
            </div>
          </div>
        `;
      }
      // 6. 視覺矩陣 (Visual Matrix)
      else if (data.type === "visual_matrix") {
        contentHtml = `
          <div class="flex-1 flex flex-col justify-between space-y-6">
            <div>
              <div class="flex items-center gap-3 mb-2">
                <span class="warm-badge bg-warm-200 text-warm-800 border border-warm-300 slide-text-badge px-4 py-1.5">
                  ${data.badge}
                </span>
                <span class="slide-text-meta font-bold text-warm-600">${data.module}</span>
              </div>
              <h2 class="slide-text-title font-black text-warm-900 tracking-tight">${data.title}</h2>
              <p class="slide-text-subhead font-bold text-warm-600 mt-1">${data.subtitle}</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-${data.data.cards.length === 3 ? '3' : '2'} gap-6 flex-1 items-stretch">
              ${data.data.cards.map(c => `
                <div class="warm-card p-6 flex flex-col justify-between hover:border-terracotta-400 transition">
                  <div>
                    <div class="w-12 h-12 rounded-xl bg-warm-100 text-terracotta-600 flex items-center justify-center font-black mb-3.5">
                      <i data-lucide="${c.icon || 'box'}" class="w-7 h-7"></i>
                    </div>
                    <h3 class="slide-text-subhead font-bold text-warm-900 mb-2">${c.title}</h3>
                    <p class="slide-text-body text-warm-800 font-semibold leading-relaxed">${c.desc}</p>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="p-5 rounded-2xl bg-warm-100 border-2 border-warm-200 flex items-center gap-3 slide-text-body font-bold text-warm-900 shadow-sm">
              <i data-lucide="lightbulb" class="w-8 h-8 text-terracotta-500 flex-shrink-0"></i>
              <span>${data.data.insight}</span>
            </div>
          </div>
        `;
      }
      // 7. 流程總覽 (Flow Chart) - 升級為 3x2 格局，確保 28pt 大字體絕不擁擠
      else if (data.type === "flow_chart") {
        contentHtml = `
          <div class="flex-1 flex flex-col justify-between space-y-6">
            <div>
              <div class="flex items-center gap-3 mb-2">
                <span class="warm-badge bg-sage-100 text-sage-700 border border-sage-300 slide-text-badge px-4 py-1.5">
                  ${data.badge}
                </span>
                <span class="slide-text-meta font-bold text-warm-600">${data.module}</span>
              </div>
              <h2 class="slide-text-title font-black text-warm-900 tracking-tight">${data.title}</h2>
              <p class="slide-text-subhead font-bold text-warm-600 mt-1">${data.subtitle}</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 flex-1 items-stretch">
              ${data.data.flow.map(f => `
                <div class="warm-card p-6 flex flex-col justify-between text-left hover:border-terracotta-400 transition">
                  <div>
                    <div class="flex items-center gap-3 mb-3">
                      <div class="w-10 h-10 rounded-full bg-terracotta-100 text-terracotta-700 font-black slide-text-meta flex items-center justify-center border-2 border-terracotta-300 flex-shrink-0">
                        ${f.step}
                      </div>
                      <h3 class="slide-text-subhead font-bold text-warm-900">${f.name}</h3>
                    </div>
                    <p class="slide-text-body text-warm-800 font-semibold leading-relaxed">${f.desc}</p>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="p-5 rounded-2xl bg-warm-100 border-2 border-warm-200 flex items-center gap-3 slide-text-body font-bold text-warm-900 shadow-sm">
              <i data-lucide="lightbulb" class="w-8 h-8 text-terracotta-500 flex-shrink-0"></i>
              <span>${data.data.insight}</span>
            </div>
          </div>
        `;
      }
      // 8. 結論 (Conclusion)
      else if (data.type === "conclusion") {
        contentHtml = `
          <div class="flex-1 flex flex-col justify-between space-y-6">
            <div>
              <span class="warm-badge bg-terracotta-500 text-white font-bold mb-2 slide-text-badge px-4 py-1.5">
                ${data.badge}
              </span>
              <h2 class="slide-text-hero font-black text-warm-900 tracking-tight mt-1">${data.title}</h2>
              <p class="slide-text-subhead font-bold text-terracotta-600 mt-1">${data.subtitle}</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-1 items-stretch">
              ${data.data.actions.map(act => `
                <div class="warm-card p-6 flex flex-col justify-between border-t-8 border-terracotta-500">
                  <div>
                    <span class="slide-text-meta font-black text-terracotta-600 tracking-wider">${act.step}</span>
                    <h3 class="slide-text-subhead font-bold text-warm-900 mt-1 mb-3">${act.title}</h3>
                    <p class="slide-text-body text-warm-800 font-semibold leading-relaxed">${act.desc}</p>
                  </div>
                  <div class="mt-5 pt-3 border-t border-warm-200 slide-text-meta font-bold text-sage-700 flex items-center gap-2">
                    <i data-lucide="check-circle" class="w-6 h-6"></i> 實戰落實目標
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="p-6 rounded-2xl bg-terracotta-50 border-2 border-terracotta-300 text-center shadow-sm">
              <p class="slide-text-subhead font-black text-terracotta-900">${data.data.insight}</p>
              <p class="slide-text-meta text-warm-700 mt-1.5">全課 50 頁展示完畢 ｜ 祝各位同學成功打造個人專屬 AI Agent 團隊！</p>
            </div>
          </div>
        `;
      }

      wrapper.innerHTML = contentHtml;
      lucide.createIcons();
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        renderSlide(currentSlide);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function goToSlide(index) {
      currentSlide = index;
      renderSlide(currentSlide);
      toggleDrawer(false);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 鍵盤導航
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "Space") {
        e.preventDefault();
        nextSlide();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === "f") {
        e.preventDefault();
        toggleFullScreen();
      } else if (e.key.toLowerCase() === "m") {
        e.preventDefault();
        toggleDrawer();
      } else if (e.key === "Escape") {
        if (document.body.classList.contains("is-fullscreen")) {
          toggleFullScreen(false);
        } else {
          toggleDrawer(false);
        }
      }
    });

    // 真正滿版全螢幕控制（零邊框、撐滿 100vw x 100vh）
    function toggleFullScreen(forceState) {
      const isCurrentlyFs = document.body.classList.contains("is-fullscreen");
      const shouldFs = (forceState !== undefined) ? forceState : !isCurrentlyFs;

      if (shouldFs) {
        document.body.classList.add("is-fullscreen");
        if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      } else {
        document.body.classList.remove("is-fullscreen");
        if (document.exitFullscreen && document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement) {
        document.body.classList.add("is-fullscreen");
      } else {
        document.body.classList.remove("is-fullscreen");
      }
    });

    // 手機觸控左右滑動
    let touchStartX = 0;
    let touchStartY = 0;
    document.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener("touchend", (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX < 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }
    }, { passive: true });

    function toggleDrawer(forceState) {
      const drawer = document.getElementById("overview-drawer");
      const backdrop = document.getElementById("drawer-backdrop");
      const isOpen = !drawer.classList.contains("translate-x-full");
      const shouldOpen = (forceState !== undefined) ? forceState : !isOpen;

      if (shouldOpen) {
        drawer.classList.remove("translate-x-full");
        backdrop.classList.remove("hidden");
      } else {
        drawer.classList.add("translate-x-full");
        backdrop.classList.add("hidden");
      }
    }

    function buildDrawerList() {
      const listContainer = document.getElementById("drawer-list");
      listContainer.innerHTML = slidesData.map((s, idx) => `
        <div onclick="goToSlide(${idx})" class="p-3.5 rounded-xl bg-white border border-warm-200 hover:border-terracotta-500 hover:shadow-sm cursor-pointer transition flex items-center justify-between group">
          <div class="flex items-center gap-3 min-w-0">
            <span class="w-8 h-8 rounded-lg bg-warm-100 text-warm-900 font-mono text-sm font-black flex items-center justify-center group-hover:bg-terracotta-500 group-hover:text-white transition flex-shrink-0">
              ${String(idx + 1).padStart(2, '0')}
            </span>
            <div class="min-w-0">
              <div class="text-sm font-bold text-warm-900 group-hover:text-terracotta-600 transition truncate">${s.title}</div>
              <div class="text-xs text-warm-500 font-semibold truncate">${s.module}</div>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-warm-400 group-hover:text-terracotta-500 transition flex-shrink-0"></i>
        </div>
      `).join('');
    }

    window.addEventListener("DOMContentLoaded", () => {
      buildDrawerList();
      renderSlide(currentSlide);
    });
  </script>
</body>
</html>
